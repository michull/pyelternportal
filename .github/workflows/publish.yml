name: Publish verified library
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify tag version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/version mismatch'
          PY
      - run: python -m pip install . pytest pytest-asyncio pytest-cov pytest-socket build twine
      - run: pytest -q --disable-socket --allow-unix-socket --cov=pyelternportal.counts --cov-fail-under=100 --cov-report=json
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
